<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <title>WOPR</title>
  <link rel="stylesheet" href="/styles.css" />
<meta property="og:type" content="website" />
<meta property="og:title" content="WOPR" />
<meta property="og:description" content="Shall we play a game?" />
<meta property="og:url" content="https://joshua-wopr.goislandadventures.workers.dev/" />
<meta property="og:image" content="https://joshua-wopr.goislandadventures.workers.dev/wopr-social.jpg" />

<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="WOPR" />
<meta name="twitter:description" content="Shall we play a game?" />
<meta name="twitter:image" content="https://joshua-wopr.goislandadventures.workers.dev/wopr-social.jpg" />
</head>
<body>
  <main class="stage">
    <section class="monitor" aria-label="WOPR terminal">
      <div class="glass">
        <div class="raster" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>

        <section class="screen">
          <section id="sim-panel" class="sim-panel hidden" aria-label="Global Thermonuclear War simulation display">
            <div id="gtw-side-view" class="gtw-side-view hidden">
              <svg class="gtw-side-svg" viewBox="0 0 1000 360" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                <g class="side-country us-side">
                  <path d="M70 80 L96 60 L130 48 L166 47 L205 50 L235 46 L260 58 L281 57 L304 71 L315 91 L309 111 L319 128 L300 145 L278 143 L256 153 L232 158 L210 171 L184 176 L164 194 L137 194 L110 181 L96 166 L78 159 L70 139 L80 120 L66 101 Z" />
                  <path d="M321 181 L338 181 L347 191 L340 204 L323 204 Z" />
                  <text x="188" y="245">UNITED STATES</text>
                </g>

                <g class="side-country soviet-side">
                  <path d="M545 87 L573 69 L608 66 L640 50 L681 49 L704 62 L737 59 L773 54 L811 61 L850 72 L884 88 L902 106 L894 124 L873 132 L857 147 L830 146 L810 157 L783 155 L763 167 L731 168 L710 181 L681 177 L657 187 L628 181 L609 162 L583 157 L566 141 L546 135 L540 115 Z" />
                  <path d="M849 151 L864 151 L873 162 L862 175 L847 171 Z" />
                  <text x="716" y="245">SOVIET UNION</text>
                </g>
              </svg>
            </div>

            <div id="gtw-map-view" class="gtw-map-view hidden">
              <svg viewBox="0 0 1000 460" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
                <g class="world-outline">
                  <polyline points="33.3,46 83.3,51.1 125,76.7 152.8,102.2 155.6,127.8 175,148.2 202.8,168.7 230.6,181.4 263.9,184 275,166.1 291.7,140.6 313.9,115 333.3,102.2 327.8,81.8 277.8,71.6 236.1,51.1 194.4,46 152.8,46 97.2,38.3 33.3,46" />
                  <polyline points="275,199.3 305.6,209.6 338.9,217.2 361.1,242.8 375,268.3 369.4,301.6 347.2,332.2 313.9,370.6 300,345 291.7,306.7 283.3,268.3 275,230 275,199.3" />
                  <polyline points="472.2,138 486.1,117.6 513.9,102.2 541.7,89.4 569.4,76.7 597.2,63.9 652.8,51.1 722.2,46 791.7,51.1 861.1,63.9 916.7,81.8 958.3,102.2 986.1,115 958.3,140.6 916.7,153.3 875,140.6 847.2,115 819.4,127.8 791.7,153.3 763.9,166.1 722.2,178.9 694.4,178.9 666.7,166.1 638.9,153.3 611.1,140.6 583.3,127.8 555.6,115 527.8,115 500,127.8 472.2,138" />
                  <polyline points="452.8,140.6 500,135.4 541.7,148.2 577.8,178.9 597.2,217.2 583.3,255.6 555.6,293.9 527.8,319.4 500,306.7 477.8,268.3 466.7,217.2 452.8,178.9 452.8,140.6" />
                  <polyline points="811.1,255.6 861.1,258.1 902.8,281.1 925,306.7 902.8,332.2 855.6,337.3 819.4,314.3 811.1,281.1 811.1,255.6" />
                  <polyline points="355.6,17.9 416.7,38.3 444.4,63.9 402.8,81.8 361.1,76.7 319.4,51.1 355.6,17.9" />
                  <polyline points="477.8,102.2 486.1,81.8 500,89.4 505.6,102.2" />
                  <polyline points="861.1,145.7 875,138 888.9,127.8 902.8,117.6" />
                </g>

                <g class="soviet-outline">
                  <polyline points="555.6,51.1 597.2,46 652.8,38.3 722.2,35.8 791.7,40.9 861.1,51.1 930.6,63.9 972.2,76.7 972.2,102.2 930.6,115 888.9,107.3 847.2,97.1 805.6,102.2 763.9,107.3 722.2,102.2 680.6,97.1 652.8,89.4 625,97.1 597.2,102.2 583.3,89.4 569.4,76.7 555.6,51.1" />
                </g>

                <g id="target-labels"></g>
                <g id="trajectories"></g>
                <g id="impacts"></g>
              </svg>

              <div class="sim-readout">
                <span id="scenario">TRACKING</span>
                <span id="outcome">CALCULATING</span>
              </div>
            </div>
          </section>

          <div id="terminal" class="terminal" role="log" aria-live="polite"></div>

          <form id="command-form" class="input-row" autocomplete="off">
            <span id="prompt" class="prompt">LOGON:</span>
            <span class="input-wrap">
              <input
                id="command"
                aria-label="Terminal input"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                autofocus
              />
              <span class="block-cursor" aria-hidden="true"></span>
            </span>
          </form>

          <section id="ttt-panel" class="ttt-panel hidden" aria-label="Tic-Tac-Toe board">
            <div id="ttt-board" class="ttt-board"></div>
            <div id="ttt-status" class="ttt-status"></div>
          </section>
        </section>
      </div>
    </section>

    <aside class="speaker-box" aria-label="JOSHUA speaker">
      <div class="speaker-screws" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="speaker-grille" aria-hidden="true"></div>
      <div class="speaker-label">JOSHUA</div>
      <div class="visit-counter" aria-label="Total game visits">
        <span class="visit-counter-label">VISITS</span>
        <span id="visit-count" class="visit-counter-value" aria-live="polite">------</span>
      </div>
      <div id="voice-switch" class="voice-switch" role="switch" aria-checked="false" aria-label="Turn JOSHUA voice on">
        <span class="toggle-slot" aria-hidden="true"><span class="toggle-lever"></span></span>
        <span id="voice-state">VOICE OFF</span>
      </div>
      <div class="ai-voice-disclosure">AI-GENERATED VOICE</div>
    </aside>
  </main>

  <script src="/vendor/espeakng.js"></script>
  <script src="/app.js"></script>
  <script src="/audio-fix.js"></script>
  <script src="/behavior-fix.js"></script>
  <script src="/voice-fix.js"></script>
  <script src="/session-fix.js"></script>
  <script src="/gtw-script-fix.js"></script>
  <script src="/movie-audio.js"></script>
</body>
</html>
