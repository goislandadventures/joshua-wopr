<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080808" />
  <title>WOPR</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="stage">
    <section class="monitor" aria-label="WOPR terminal">
      <div class="glass">
        <div class="raster" aria-hidden="true"></div>
        <div class="vignette" aria-hidden="true"></div>

        <section class="screen">
          <div id="terminal" class="terminal" role="log" aria-live="polite"></div>

          <form id="command-form" class="input-row" autocomplete="off">
            <span id="prompt" class="prompt">LOGON:</span>
            <span class="input-wrap">
              <input
                id="command"
                aria-label="Terminal input"
                spellcheck="false"
                autocapitalize="off"
                autocomplete="off"
                autofocus
              />
              <span class="block-cursor" aria-hidden="true"></span>
            </span>
          </form>

          <section id="sim-panel" class="sim-panel hidden" aria-label="Global Thermonuclear War simulation display">
            <div class="sim-title">GLOBAL THERMONUCLEAR WAR</div>
            <svg viewBox="0 0 1000 460" preserveAspectRatio="none" aria-hidden="true">
              <g class="grid">
                <path d="M0 92H1000M0 184H1000M0 276H1000M0 368H1000" />
                <path d="M125 0V460M250 0V460M375 0V460M500 0V460M625 0V460M750 0V460M875 0V460" />
              </g>
              <g class="continents">
                <path class="us-zone" d="M94 124l48-53 87-21 72 16 24 35-19 27-55 9-34 37-45 3-41-19z" />
                <path class="us-zone" d="M273 191l32 20 29 69-16 70-39 50-21-66 10-76-24-42z" />
                <path class="soviet-zone" d="M500 112l52-48 93 3 44 31 67-12 91 32 55 58-31 29-78-7-42 26-50-12-44 18-50-26-55 9-35-38-54-13z" />
                <path class="neutral-zone" d="M586 217l54 22 36 58-11 85-54 23-36-64 10-64-24-29z" />
                <path class="neutral-zone" d="M811 312l57-15 58 31-16 44-79 8-40-31z" />
              </g>
              <g id="target-labels"></g>
              <g id="trajectories"></g>
              <g id="impacts"></g>
            </svg>
            <div class="sim-readout">
              <span id="scenario">TRACKING</span>
              <span id="outcome">CALCULATING</span>
            </div>
          </section>
        </section>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
